services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://parksense:parksense123@db:5432/parksense
      - AUTH_SECRET=${AUTH_SECRET:-dev-auth-secret-change-in-production}
      - AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=parksense
      - POSTGRES_PASSWORD=parksense123
      - POSTGRES_DB=parksense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
