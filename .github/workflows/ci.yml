name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parksense
          POSTGRES_PASSWORD: parksense123
          POSTGRES_DB: parksense
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint
        continue-on-error: true

      - run: npx tsc --noEmit
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parksense
          POSTGRES_PASSWORD: parksense123
          POSTGRES_DB: parksense
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://parksense:parksense123@localhost:5432/parksense

      - run: npm test
        env:
          DATABASE_URL: postgresql://parksense:parksense123@localhost:5432/parksense
          AUTH_SECRET: test-secret
          AUTH_URL: http://localhost:3000

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npm run build
        env:
          DATABASE_URL: postgresql://parksense:parksense123@localhost:5432/parksense
          AUTH_SECRET: build-secret
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
